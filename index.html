<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>우리동네 성지 검색</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f9f9f9;
      padding: 40px;
      text-align: center;
    }
    input {
      width: 300px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    li {
      background: #fff;
      border: 1px solid #ddd;
      margin-bottom: 8px;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    li:hover {
      background-color: #f0f0f0;
    }
    .note {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h2>우리동네 휴대폰 성지 검색</h2>
  <input type="text" id="addrInput" placeholder="예: 부천, 전주, 강남" oninput="filterResults()">
  <ul id="resultList"></ul>

  <script>
    const storeList = [
      {
        name: "부천지점",
        keyword: "부천",
        url: "https://cafe.naver.com/bjphone?iframe_url=/ArticleList.nhn?search.clubid=14006524&search.menuid=2378&search.boardtype=L"
      },
      {
        name: "전주완산지점",
        keyword: "전주",
        url: "https://cafe.naver.com/examplecafe?iframe_url=/ArticleList.nhn?search.clubid=12345678&search.menuid=1111"
      },
      {
        name: "전주덕진지점",
        keyword: "전주",
        url: "https://cafe.naver.com/examplecafe?iframe_url=/ArticleList.nhn?search.clubid=12345678&search.menuid=2222"
      }
    ];

    function filterResults() {
      const input = document.getElementById('addrInput').value.trim().toLowerCase();
      const list = document.getElementById('resultList');
      list.innerHTML = '';

      if (input.length < 1) return;

      const filtered = storeList.filter(store =>
        store.keyword.toLowerCase().includes(input) || store.name.toLowerCase().includes(input)
      );

      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.textContent = "해당 지역의 지점을 찾을 수 없습니다.";
        list.appendChild(li);
        return;
      }

      filtered.forEach(store => {
        const li = document.createElement('li');
        li.textContent = store.name;

        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = "※ 일부 게시판은 네이버 카페 회원만 열람 가능합니다.";

        li.appendChild(note);
        li.onclick = () => {
          window.open(store.url, '_blank');
        };
        list.appendChild(li);
      });
    }
  </script>

</body>
</html>
