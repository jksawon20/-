<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>우리동네 성지 찾기</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      padding: 50px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 350px;
      padding: 12px 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 20px auto;
      max-width: 400px;
    }

    li {
      background: #fff;
      border: 1px solid #ddd;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    li:hover {
      background-color: #e9f5ff;
    }
  </style>
</head>
<body>

  <h2>우리동네 휴대폰 성지 검색</h2>
  <input type="text" id="addrInput" placeholder="예: 부천, 전주, 강남" oninput="filterResults()">
  <ul id="resultList"></ul>

  <script>
    // 지점 목록
    const storeList = [
      {
        name: "부천지점",
        keyword: "부천",
        url: "https://cafe.naver.com/bjphone?iframe_url=/ca-fe/cafes/14006524/members/fNm-9yph9xDL1Y9lIdNMyg"
      },
      {
        name: "전주완산지점",
        keyword: "전주",
        url: "https://cafe.naver.com/example?iframe_url=/ArticleList.nhn?search.clubid=12345678&search.menuid=1111"
      },
      {
        name: "전주덕진지점",
        keyword: "전주",
        url: "https://cafe.naver.com/example?iframe_url=/ArticleList.nhn?search.clubid=12345678&search.menuid=2222"
      }
    ];

    function filterResults() {
      const input = document.getElementById('addrInput').value.trim().toLowerCase();
      const list = document.getElementById('resultList');
      list.innerHTML = '';

      if (input.length < 1) return;

      const filtered = storeList.filter(store =>
        store.keyword.toLowerCase().includes(input) || store.name.toLowerCase().includes(input)
      );

      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.textContent = "해당 지역의 지점을 찾을 수 없습니다.";
        list.appendChild(li);
        return;
      }

      filtered.forEach(store => {
        const li = document.createElement('li');
        li.textContent = store.name;
        li.onclick = () => {
          window.open(store.url, '_blank');
        };
        list.appendChild(li);
      });
    }
  </script>

</body>
</html>
